<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow border-secondary">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Вход в Админ-панель</h4>

                {% if error %}
                    <div class="alert alert-danger py-2 text-center">Неверный пароль!</div>
                {% endif %}

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label class="form-label">Пароль администратора:</label>
                        <input type="password" name="password" class="form-control" placeholder="Введите пароль" required autofocus autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted small">← Вернуться на главную</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
