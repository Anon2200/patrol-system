<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход администратора — Патрульная служба</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">🔑</div>
            <h1 class="login-title">Админ-панель</h1>
            <p class="login-subtitle">Патрульная служба колледжа</p>

            {% if error %}
            <div class="alert alert-error">⚠️ {{ error }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label class="form-label" for="password">🔐 Пароль администратора</label>
                    <input class="form-input" type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>

            <div class="login-footer">
                <a href="/">← Вернуться на страницу патрульного</a>
            </div>
        </div>
    </div>
</body>
</html>
