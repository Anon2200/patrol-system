<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход администратора — Патрульная служба</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }
        .card-header-custom {
            border-radius: 1rem 1rem 0 0;
            background-color: #212529;
            color: #fff;
            padding: 1.25rem 1.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card card-custom">
                <div class="card-header-custom text-center">
                    <h4 class="mb-0">Админ-панель</h4>
                    <small>Патрульная служба колледжа</small>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="post" action="/login">
                        <div class="mb-4">
                            <label for="password" class="form-label">Пароль администратора</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Введите пароль" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2">Войти</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/" class="text-decoration-none text-muted small">Вернуться на страницу патрульного</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
