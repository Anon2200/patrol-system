<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Штаб — Патрульная служба</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js"></script>
    <style>
        .hq-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }
        .hq-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .hq-title { font-size: 20px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
        .hq-clock { font-size: 22px; color: var(--text); letter-spacing: 0.08em; }
        .hq-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .hq-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 26px; text-align: center; position: relative; overflow: hidden; }
        .hq-tile::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), transparent); }
        .hq-num { font-family: ui-monospace, "Consolas", monospace; font-size: 64px; font-weight: 800; color: var(--accent); line-height: 1; }
        .hq-label { margin-top: 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
        .hq-duty { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 4px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; letter-spacing: 0.06em; }
        .hq-feed { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
        .hq-feed-title { font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text); margin-bottom: 14px; }
        .hq-row { display: flex; gap: 14px; align-items: baseline; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--panel2); margin-bottom: 8px; font-size: 14px; animation: reveal 0.4s ease both; }
        .hq-row .t { font-family: ui-monospace, "Consolas", monospace; color: var(--accent); font-weight: 700; }
        .hq-row .g { font-family: ui-monospace, "Consolas", monospace; color: var(--accent2); font-weight: 700; }
        .hq-row .p { color: var(--muted); margin-left: auto; font-size: 12px; }
        .hq-empty { color: var(--muted); padding: 20px; text-align: center; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>
    <div class="hq-wrap">
        <div class="hq-top">
            <div class="hq-title">Оперативный монитор · Штаб</div>
            <div class="hq-clock mono" id="hqClock">--.--.---- --:--:--</div>
        </div>

        <div class="hq-grid">
            <div class="hq-tile">
                <div class="hq-num" id="hqToday">0</div>
                <div class="hq-label">Нарушений сегодня</div>
            </div>
            <div class="hq-tile">
                <div class="hq-num" id="hqWeek">0</div>
                <div class="hq-label">За 7 дней</div>
            </div>
            <div class="hq-tile">
                <div class="hq-num" id="hqShifts">0</div>
                <div class="hq-label">Открытых смен</div>
            </div>
        </div>

        <div class="hq-duty" id="hqDuty">Дежурные сегодня: —</div>

        <div class="hq-feed">
            <div class="hq-feed-title">Лента фиксаций</div>
            <div id="hqFeed"><div class="hq-empty">Ожидание данных...</div></div>
        </div>

        <div style="margin-top: 20px;">
            <a href="/admin" class="btn btn-secondary btn-sm">← Вернуться в панель</a>
        </div>
    </div>

    <script>
        async function hqRefresh() {
            try {
                const r = await fetch('/hq/data');
                const d = await r.json();
                if (!d.ok) return;
                document.getElementById('hqClock').textContent = d.clock;
                document.getElementById('hqToday').textContent = d.today;
                document.getElementById('hqWeek').textContent = d.week;
                document.getElementById('hqShifts').textContent = d.open_shifts;
                document.getElementById('hqDuty').textContent = d.on_duty.length
                    ? 'Дежурные сегодня: ' + d.on_duty.join(', ')
                    : 'Сегодня дежурных нет';
                const feedEl = document.getElementById('hqFeed');
                if (!d.feed.length) {
                    feedEl.innerHTML = '<div class="hq-empty">Записей пока нет</div>';
                } else {
                    feedEl.innerHTML = d.feed.map(function (f) {
                        return '<div class="hq-row">' +
                            '<span class="t">' + f.time + '</span>' +
                            '<span class="g">' + f.group + '</span>' +
                            '<span>' + f.type + '</span>' +
                            '<span class="p">' + f.patrol + '</span>' +
                            '</div>';
                    }).join('');
                }
            } catch (e) {
                /* тишина до следующего обновления */
            }
        }
        hqRefresh();
        setInterval(hqRefresh, 20000);
    </script>
</body>
</html>
