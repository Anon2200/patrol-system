<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование записи — Патрульная служба</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js"></script>
</head>
<body>
    {% include "sidebar.html" %}
    <div class="container">
        <div class="page-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="menu-toggle-inline" onclick="openSidebar()" title="Меню">☰</button>
                <div class="page-title"><span>✏️</span><span>Редактирование записи №{{ v.id }}</span></div>
            </div>
        </div>

        <div class="card" style="max-width: 640px;">
            <form action="/admin/edit/{{ v.id }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="student_group">🏫 Группа нарушителя</label>
                    <input class="form-input" type="text" id="student_group" name="student_group" value="{{ v.student_group }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="student_name">👤 ФИО студента</label>
                    <input class="form-input" type="text" id="student_name" name="student_name" value="{{ v.student_name }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="violation_type">⚠️ Тип нарушения</label>
                    <select class="form-select" id="violation_type" name="violation_type" required>
                        {% for v_type in violation_types %}
                        <option value="{{ v_type }}" {% if v.violation_type == v_type %}selected{% endif %}>{{ v_type }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="comment">💬 Комментарий</label>
                    <textarea class="form-textarea" id="comment" name="comment">{{ v.comment or '' }}</textarea>
                </div>

                <div class="filters-actions">
                    <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
                    <a href="/admin" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
