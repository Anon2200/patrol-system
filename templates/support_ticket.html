<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Связь с разработчиком</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js"></script>
</head>
<body>
<div class="container" style="max-width: 600px;">
    <div class="page-header">
        <div class="page-title"><span class="status-dot"></span><span>Заявка разработчику</span></div>
        <a href="/" class="nav-link nav-link-primary">← Назад</a>
    </div>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form action="/support/create" method="POST" enctype="multipart/form-data" class="card">
        <div class="form-group">
            <label class="form-label" for="contact">Контакт для ответа (ник в MAX / email)</label>
            <input class="form-input" type="text" id="contact" name="contact" value="{{ default_contact }}" placeholder="Оставьте пустым, чтобы отвечать через сайт">
        </div>
        <div class="form-group">
            <label class="form-label" for="subject">Тема обращения *</label>
            <input class="form-input" type="text" id="subject" name="subject" required maxlength="200" placeholder="Кратко суть проблемы">
        </div>
        <div class="form-group">
            <label class="form-label" for="description">Описание проблемы *</label>
            <textarea class="form-textarea" id="description" name="description" required rows="8" placeholder="Что произошло? Какой шаг привёл к ошибке? Что ожидали увидеть?"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="screenshot">Скриншот ошибки (необязательно, до 5 МБ)</label>
            <input class="form-input" type="file" id="screenshot" name="screenshot" accept="image/*">
            <small style="color: var(--muted); display: block; margin-top: 4px;">JPG, PNG. Поможет быстрее понять проблему.</small>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Отправить заявку</button>
    </form>
</div>
<script>const t={{ request.query_params.get('toast')|tojson }};if(t)showToast(t);</script>
</body>
</html>
