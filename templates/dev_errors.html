<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал ошибок — Патрульная служба</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js"></script>
</head>
<body>
    {% include "sidebar.html" %}
    <div class="container">
        <div class="page-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="menu-toggle-inline" onclick="openSidebar()" title="Меню">☰</button>
                <div class="page-title"><span>Журнал ошибок</span></div>
            </div>
            <div class="nav-links">
                <form action="/dev/errors/clear" method="POST" onsubmit="return confirm('Очистить журнал ошибок?');">
                    <button type="submit" class="btn btn-danger btn-sm">Очистить</button>
                </form>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                <div class="table-title">Последние 100 событий</div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Дата и время</th>
                            <th>Адрес</th>
                            <th>Сообщение</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for r in rows %}
                        <tr>
                            <td class="mono">{{ r.created_at }}</td>
                            <td class="mono">{{ r.path }}</td>
                            <td style="white-space: pre-wrap;">{{ r.message }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3">
                                <div class="empty-state">
                                    <div class="empty-state-icon">∅</div>
                                    <div class="empty-state-text">Ошибок не зафиксировано</div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const toastMsg = {{ request.query_params.get('toast') | tojson }};
        if (toastMsg) { showToast(toastMsg); }
    </script>
</body>
</html>
