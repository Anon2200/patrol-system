<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Патрульная служба колледжа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }
        .card-header-custom {
            border-radius: 1rem 1rem 0 0;
            background-color: #0d6efd;
            color: #fff;
            padding: 1.25rem 1.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            {% if not logged_in %}
            <!-- ФОРМА ВХОДА ПАТРУЛЬНОГО -->
            <div class="card card-custom">
                <div class="card-header-custom text-center">
                    <h4 class="mb-0">Патрульная служба</h4>
                    <small>Вход для патрульного</small>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="post" action="/patrol/login">
                        <div class="mb-3">
                            <label for="patrol_name" class="form-label">Ваше ФИО</label>
                            <select class="form-select" id="patrol_name" name="patrol_name" required>
                                <option value="" selected disabled>Выберите ФИО из списка</option>
                                {% for name in patrol_names %}
                                <option value="{{ name }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="pin" class="form-label">ПИН-код</label>
                            <input type="password" inputmode="numeric" class="form-control" id="pin" name="pin"
                                   placeholder="Введите ПИН-код" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none text-muted small">Вход для администратора</a>
                    </div>
                </div>
            </div>

            {% else %}
            <!-- ФОРМА ВНЕСЕНИЯ НАРУШЕНИЯ -->
            <div class="card card-custom">
                <div class="card-header-custom d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-0">Фиксация нарушения</h5>
                        <small>Патрульный: {{ patrol_name }}</small>
                    </div>
                    <a href="/patrol/logout" class="btn btn-sm btn-outline-light">Выйти</a>
                </div>
                <div class="card-body p-4">
                    {% if success %}
                    <div class="alert alert-success" role="alert">
                        Нарушение успешно сохранено.
                    </div>
                    {% endif %}
                    <form method="post" action="/add">
                        <div class="mb-3">
                            <label for="student_group" class="form-label">Группа нарушителя</label>
                            <input type="text" class="form-control" id="student_group" name="student_group"
                                   placeholder="Например: ИС-21" required>
                        </div>
                        <div class="mb-3">
                            <label for="student_name" class="form-label">ФИО студента-нарушителя</label>
                            <input type="text" class="form-control" id="student_name" name="student_name"
                                   placeholder="Фамилия Имя Отчество" required>
                        </div>
                        <div class="mb-3">
                            <label for="violation_type" class="form-label">Тип нарушения</label>
                            <select class="form-select" id="violation_type" name="violation_type" required>
                                {% for v_type in violation_types %}
                                <option value="{{ v_type }}">{{ v_type }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="comment" class="form-label">Детали / Комментарий</label>
                            <textarea class="form-control" id="comment" name="comment" rows="3"
                                      placeholder="Необязательно"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Сохранить нарушение</button>
                    </form>
                </div>
            </div>
            {% endif %}

        </div>
    </div>
</div>
</body>
</html>
