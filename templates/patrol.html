<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Патрульная служба</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <!-- Ссылка на вход в админ-панель -->
                <div class="text-end mb-2">
                    <a href="/login" class="text-decoration-none text-muted small">Вход для администратора →</a>
                </div>

                <h3 class="card-title text-center mb-4">Патрульная служба</h3>

                {% if error %}
                    <div class="alert alert-danger">Неверный ПИН-код или патрульный!</div>
                {% endif %}
                {% if success %}
                    <div class="alert alert-success">Нарушение успешно зафиксировано!</div>
                {% endif %}

                {% if not patrol_name %}
                    <!-- Форма входа для патрульного -->
                    <form action="/patrol/login" method="post">
                        <div class="mb-3">
                            <label class="form-label">Выберите патрульного:</label>
                            <select name="patrol_name" class="form-select form-select-lg" required>
                                <option value="" selected disabled>-- Выберите из списка --</option>
                                {% for name in patrols_list %}
                                    <option value="{{ name }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Введите ПИН-код:</label>
                            <input type="password" name="pin" class="form-control form-control-lg" placeholder="4 цифры" required autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
                    </form>
                {% else %}
                    <!-- Форма фиксации нарушения -->
                    <div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-white rounded border">
                        <span>Патрульный: <strong>{{ patrol_name }}</strong></span>
                        <a href="/patrol/logout" class="btn btn-outline-secondary btn-sm">Сменить</a>
                    </div>

                    <form action="/add" method="post">
                        <div class="mb-3">
                            <label class="form-label">ФИО Студента:</label>
                            <input type="text" name="student_name" class="form-control" placeholder="Иванов Иван" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Группа:</label>
                            <input type="text" name="student_group" class="form-control" placeholder="Например: БПЛА-61" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Тип нарушения:</label>
                            <select name="violation_type" class="form-select" required>
                                <option value="" selected disabled>Выберите тип...</option>
                                <option value="Опоздание">Опоздание</option>
                                <option value="Внешний вид">Внешний вид / Форма</option>
                                <option value="Дисциплина">Нарушение дисциплины</option>
                                <option value="Курение">Курение в неположенном месте</option>
                                <option value="Другое">Другое</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Комментарий (необязательно):</label>
                            <textarea name="comment" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger btn-lg w-100">Зафиксировать нарушение</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
